{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}E‑Commerce{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body>
    <!-- Top utility bar -->
    <div class="topbar bg-white border-bottom">
      <div class="container d-flex justify-content-end small py-1">
        <div class="me-3 text-muted"><i class="bi bi-telephone"></i> CALL +237 689396283</div>
        <div class="me-3"><a href="#" class="text-muted text-decoration-none">APROPOS DE NOUS</a></div>
        <div class="me-3"><a href="#" class="text-muted text-decoration-none">CONTACTER NOUS</a></div>
        <div><a href="#" class="text-muted text-decoration-none"><i class="bi bi-person"></i> LOGIN</a></div>
      </div>
    </div>

    <!-- Navbar -->
    {% include 'app/includes/navbar.html' %}

    <!-- Main -->
    <main class="py-4">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- Footer -->
    {% include 'app/includes/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
